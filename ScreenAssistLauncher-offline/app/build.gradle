plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screenassist.launcher'
    compileSdk 32

    defaultConfig {
        applicationId 'com.screenassist.launcher'
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName '1.1.0'
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}